[providers]
python = true
node = false

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate",
    "cd backend && pip install -r requirements.txt"
]

[start]
cmd = "cd backend && . /opt/venv/bin/activate && alembic upgrade head && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
